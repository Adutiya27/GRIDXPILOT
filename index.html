<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridPilot X - Industrial Precision</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      // Suppress "Tailwind CDN in production" warning for cleaner logs
      const originalWarn = console.warn;
      console.warn = (...args) => {
        if (args[0]?.includes?.('cdn.tailwindcss.com')) return;
        originalWarn.apply(console, args);
      };

      // Tailwind Configuration
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                bg: '#f8fafc',       // Slate 50
                surface: '#ffffff',  // White
                panel: '#f1f5f9',    // Slate 100
                border: '#cbd5e1',   // Slate 300
                primary: '#1e3a8a',  // Navy Blue 900
                accent: '#059669',   // Emerald 600
                danger: '#dc2626',   // Red 600
                warning: '#d97706',  // Amber 600
                text: '#0f172a',     // Slate 900
                'text-dim': '#64748b' // Slate 500
              }
            },
            animation: {
              'slide-up': 'slideUp 0.4s ease-out forwards',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
            },
            keyframes: {
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Technical Grid Background */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(#e2e8f0 1px, transparent 1px),
          linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.4;
        z-index: -1;
        pointer-events: none;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      /* CRASH PREVENTION: Ensure charts always have height */
      .recharts-responsive-container {
        min-height: 300px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
   <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
